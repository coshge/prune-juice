name: release

# CLI and app tags release independently.
on:
  push:
    tags: ["cli-v*", "app-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to re-release
        required: true

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CI: "1"

jobs:
  # Nothing is built for a release until the tests pass. A tag is not a
  # promise that the code works, and a published release is.
  verify:
    outputs:
      product: ${{ steps.meta.outputs.product }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - name: validate release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.meta.outputs.product == 'cli'
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        if: steps.meta.outputs.product == 'cli'
        with: { save-if: "false" }
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: steps.meta.outputs.product == 'cli'
      - run: cargo test --workspace
        if: steps.meta.outputs.product == 'cli'

  # One job per target triple. Each produces a .tar.gz holding a single
  # `prune-juice` executable, which is the shape `--update` extracts.
  cli:
    if: needs.verify.outputs.product == 'cli'
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      runner: macos-15 }
          - { target: x86_64-apple-darwin,       runner: macos-15 }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      # Never written; see the note in `verify`.
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "false" }

      # The public key is compiled in here and nowhere else, so a release
      # without it would ship binaries that can never be updated. Checked
      # before the build rather than after, to fail in seconds.
      - name: refuse a build with no signing key
        env:
          PRUNE_JUICE_UPDATE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$PRUNE_JUICE_UPDATE_PUBKEY" ]; then
            echo "MINISIGN_PUBLIC_KEY is not set." >&2
            echo "Releasing without it ships binaries that can never be" >&2
            echo "updated. See RELEASING.md for generating the keypair." >&2
            exit 1
          fi

      - name: build
        env:
          PRUNE_JUICE_UPDATE_PUBKEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: cargo build --release --locked -p prune-juice-cli --target ${{ matrix.target }}

      - name: package
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#cli-v}"
          name="prune-juice-$version-${{ matrix.target }}"
          # `-C` so the archive holds a bare `prune-juice`, with no directory
          # for the extractor to have to reason about.
          tar czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" prune-juice
          shasum -a 256 "$name.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: prune-juice-*.tar.gz
          if-no-files-found: error

  # The app builds its pinned helper independently of CLI releases.
  app:
    if: needs.verify.outputs.product == 'app'
    needs: verify
    runs-on: macos-15
    env:
      # Mapped here so the steps below can branch on presence. `secrets` is
      # not available in an `if:` expression; `env` is.
      HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' && 'yes' || '' }}
      HAVE_NOTARY: ${{ (secrets.MACOS_SIGN_ID != '' && secrets.NOTARY_APPLE_ID != '') && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - name: read helper pin
        id: helper
        run: python3 scripts/release.py pin >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.helper.outputs.revision }}
          path: helper-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: build the pinned helper
        working-directory: helper-source
        run: |
          cargo test --locked --workspace
          cargo build --release --locked -p prune-juice-cli --target aarch64-apple-darwin
          cargo build --release --locked -p prune-juice-cli --target x86_64-apple-darwin
      - name: verify app and pinned helper compatibility
        run: python3 scripts/release.py check-helper helper-source
      - name: test app against the pinned helper
        working-directory: app/PruneJuice
        env:
          PJ_TEST_HELPER: ${{ github.workspace }}/helper-source/target/aarch64-apple-darwin/release/prune-juice
        run: swift test

      - name: import the Developer ID certificate
        # Optional, and absent today. Without it the bundle is ad-hoc signed:
        # updates still verify, because Sparkle checks the EdDSA signature on
        # the archive, but the *first* install has to be approved through
        # Gatekeeper by hand. See RELEASING.md.
        if: env.HAVE_CERT == 'yes'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/certificate.p12

      - name: assemble the bundle
        working-directory: app/PruneJuice
        env:
          REQUIRE_PINNED_HELPER: '1'
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_PROFILE: ""
          # Absolute: bundle.sh changes directory more than once.
          HELPER_AARCH64: ${{ github.workspace }}/helper-source/target/aarch64-apple-darwin/release/prune-juice
          HELPER_X86_64: ${{ github.workspace }}/helper-source/target/x86_64-apple-darwin/release/prune-juice
        run: |
          if [ -z "$SPARKLE_PUBLIC_KEY" ]; then
            echo "SPARKLE_PUBLIC_KEY is not set." >&2
            echo "The app would ship with no update mechanism. See RELEASING.md." >&2
            exit 1
          fi
          ./scripts/bundle.sh

      - name: notarise
        # Needs a Developer ID. Skipped until there is one, and skipping it
        # only affects the first manual install, never an update.
        if: env.HAVE_NOTARY == 'yes'
        working-directory: app/PruneJuice
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -- dist/PruneJuice-*.zip
          zip="$1"
          xcrun notarytool submit "$zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple "dist/Prune Juice.app"
          # Re-archive: the ticket is stapled into the bundle, so the archive
          # made before stapling does not contain it.
          rm -f dist/PruneJuice-*.zip
          ditto -c -k --keepParent "dist/Prune Juice.app" "$zip"

      - name: sign the update archive
        working-directory: app/PruneJuice
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle ships TWO files called sign_update, and the second is
          # `bin/old_dsa_scripts/sign_update` — a legacy DSA shell script that
          # does not understand --ed-key-file. `find | head -1` takes whichever
          # the filesystem hands back first: the right one locally, the legacy
          # one on this runner. It printed its usage to *stdout*, where the
          # command substitution below captured it as the "signature", and the
          # step failed in 80 ms with nothing in the log at all. Excluded by
          # path, and required to exist.
          tool="$(find .build/artifacts -type f -name sign_update \
                    -not -path '*old_dsa_scripts*' | head -1)"
          [ -n "$tool" ] || {
            echo "no EdDSA sign_update under .build/artifacts" >&2
            find .build/artifacts -type f -name sign_update >&2
            exit 1
          }
          # A glob, not `ls`: one filename, no parsing, and nothing a shell
          # that colourises `ls` can inject into it.
          set -- dist/PruneJuice-*.zip
          zip="$1"
          [ -f "$zip" ] || { echo "no update archive in dist/" >&2; exit 1; }

          # `--ed-key-file -` reads the key from stdin, so it never touches the
          # keychain, the filesystem, or an argument list.
          #
          # This tool reports its failures on **stdout**, which is also where
          # the signature comes from. Redirecting to a file and letting
          # `set -e` abort therefore produced a step that failed in 80 ms with
          # an empty log — twice: once on the legacy DSA script's usage text,
          # once on a key the tool rejected, with no way to see that it had
          # said so. So the failure branch prints what was captured.
          if ! printf '%s' "$SPARKLE_PRIVATE_KEY" \
               | "$tool" -p --ed-key-file - "$zip" > dist/ed-signature.txt; then
            echo "sign_update failed. It said:" >&2
            cat dist/ed-signature.txt >&2
            exit 1
          fi
          sig="$(cat dist/ed-signature.txt)"
          case "$sig" in
            "" | *Usage* | *rror* | *" "*)
              echo "sign_update printed this instead of a signature:" >&2
              echo "$sig" >&2
              exit 1 ;;
          esac

          # A signature that verifies is a signature. Checked here, because the
          # alternative place to discover it is an installed app that quietly
          # refuses every update.
          if ! printf '%s' "$SPARKLE_PRIVATE_KEY" \
               | "$tool" --verify --ed-key-file - "$zip" "$sig" > /tmp/verify.log 2>&1; then
            echo "the signature just produced does not verify:" >&2
            cat /tmp/verify.log >&2
            exit 1
          fi
          echo "signed and verified $zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            app/PruneJuice/dist/PruneJuice-*.zip
            app/PruneJuice/dist/ed-signature.txt
          if-no-files-found: error

  publish:
    needs: [verify, cli, app]
    if: always() && needs.verify.result == 'success' && (needs.cli.result == 'success' || needs.app.result == 'success')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with: { path: artifacts }

      - name: collect
        run: |
          mkdir -p release
          find artifacts -name 'prune-juice-*.tar.gz' -exec mv {} release/ \;
          find artifacts -name 'PruneJuice-*.zip' -exec mv {} release/ \;
          ls -la release

      - name: describe the release
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*-v}" >> "$GITHUB_OUTPUT"
          echo "notes=${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_OUTPUT"
          echo "base=${{ github.server_url }}/${{ github.repository }}/releases/download/$tag" >> "$GITHUB_OUTPUT"

      # The document the CLI reads. Digests are computed from the artifacts
      # that are about to be uploaded, so the manifest cannot describe
      # something else by accident.
      - name: the update manifest
        if: needs.verify.outputs.product == 'cli'
        run: |
          args=()
          for f in release/prune-juice-*.tar.gz; do
            # The triple is everything after `prune-juice-<version>-`.
            target="$(basename "$f" .tar.gz)"
            target="${target#prune-juice-${{ steps.meta.outputs.version }}-}"
            args+=(--cli "$target=$f")
          done
          cargo run -q -p xtask -- manifest \
            --version "${{ steps.meta.outputs.version }}" \
            --base-url "${{ steps.meta.outputs.base }}" \
            --notes-url "${{ steps.meta.outputs.notes }}" \
            --out release/update-manifest.json \
            "${args[@]}"
          cat release/update-manifest.json

      # Signed here and verified in the binary. This is the only link in the
      # chain that has to be trusted, which is why the key never leaves a
      # secret and the signature covers the digests rather than each file.
      - name: sign the manifest
        if: needs.verify.outputs.product == 'cli'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY is not set; the manifest would be unsigned" >&2
            echo "and every installed copy would refuse it. See RELEASING.md." >&2
            exit 1
          fi
          brew install minisign

          # A minisign key file is two lines — an `untrusted comment:` line and
          # the key — and a secret pasted as the key line alone does not load.
          # It fails with "Error while loading the secret key file", which does
          # not hint at the shape being wrong, and both plausible pastes (the
          # whole file, or the line RELEASING.md points at) are easy to make.
          # So the file is rebuilt in canonical form from whichever arrived:
          # the last non-empty line is the key, and the comment is ours to
          # supply. The comment line carries no information — minisign does not
          # read it back.
          key="$(printf '%s\n' "$MINISIGN_SECRET_KEY" | sed '/^[[:space:]]*$/d' | tail -1)"
          {
            echo "untrusted comment: minisign encrypted secret key"
            printf '%s\n' "$key"
          } > /tmp/minisign.key

          printf '%s' "$MINISIGN_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -m release/update-manifest.json \
            -t "prune-juice ${{ steps.meta.outputs.tag }}"
          rm -f /tmp/minisign.key

          # Verified against the public half before publishing. A release that
          # ships a signature nobody can check is worse than no release.
          #
          # `-P <key>` rather than `-p <file>`: the public key is stored as the
          # bare base64 line — the same form the CLI compiles in — and writing
          # that to a file makes a one-line file minisign will not load either.
          pub="$(printf '%s\n' "$MINISIGN_PUBLIC_KEY" | sed '/^[[:space:]]*$/d' | tail -1)"
          minisign -V -P "$pub" -m release/update-manifest.json

      # The document Sparkle reads. The previous feed is fetched first so the
      # version history survives; a failed download stops publication.
      - name: the Sparkle appcast
        if: needs.verify.outputs.product == 'app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api repos/{owner}/{repo}/releases/latest --jq .tag_name)"
          gh release download "$previous" --pattern appcast.xml --dir release
          mv release/appcast.xml release/previous-appcast.xml
          zip="$(ls release/PruneJuice-*.zip)"
          cargo run -q -p xtask -- appcast \
            --version "${{ steps.meta.outputs.version }}" \
            --zip "$zip" \
            --url "${{ steps.meta.outputs.base }}/$(basename "$zip")" \
            --signature "$(cat artifacts/app/ed-signature.txt)" \
            --notes-url "${{ steps.meta.outputs.notes }}" \
            --previous release/previous-appcast.xml \
            --out release/appcast.xml
          rm -f release/previous-appcast.xml
          cat release/appcast.xml

      - name: publish product and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: python3 scripts/release.py publish "$RELEASE_TAG"

      # Proves the thing that actually matters: an installed copy can find and
      # verify this release at the URL it will really use. Runs after the
      # upload, because there is nothing to find before it.
      #
      # The binary under test is unpacked from the archive that was just
      # published, not rebuilt from the same source. A rebuild tests a binary
      # nobody will ever run, and it tests this step's environment rather than
      # the artifact: the public key comes from the archive's own build, so if
      # the wrong key were compiled in, only this reads it back. The runner is
      # arm64, so it is the aarch64-apple-darwin archive that gets exercised —
      # the one most people download.
      - name: an installed copy can see this release
        if: needs.verify.outputs.product == 'cli'
        run: |
          version="${{ steps.meta.outputs.version }}"
          tar xzf "release/prune-juice-$version-aarch64-apple-darwin.tar.gz" -C /tmp
          /tmp/prune-juice --version

          # `gh release upload` returns before the asset is reliably servable
          # through releases/latest/download. The rebuild this step used to do
          # was an accidental two-minute sleep that hid that race; with it gone
          # the wait has to be deliberate, so it is bounded and says what it is
          # waiting for. `--check-update` always refetches — it is the forced
          # refresh, never the cached answer — so a retry is a real second
          # look and not the first one replayed.
          code=0
          for attempt in $(seq 1 12); do
            set +e
            /tmp/prune-juice --check-update
            code=$?
            set -e
            # 0 means "you are the newest", which is the correct answer for the
            # binary built from the tag being released. 5 means the feed could
            # not be read or verified, which is also what a release that has
            # not finished appearing looks like. 1 would mean the feed names a
            # version newer than the one just built, which no amount of waiting
            # fixes — so it is not retried.
            [ "$code" = 0 ] && { echo "verified on attempt $attempt"; exit 0; }
            [ "$code" = 5 ] || break
            echo "attempt $attempt: the feed is not readable yet; waiting"
            sleep 5
          done
          echo "the published release is not readable (exit $code)" >&2
          exit 1
